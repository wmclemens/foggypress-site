name: Bot diagnosis (temporary)
on:
  push:
    branches: [claude/project-thread-0x377q]
    paths: [build/bot_diag.py, .github/workflows/bot-diag.yml]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python build/bot_diag.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
