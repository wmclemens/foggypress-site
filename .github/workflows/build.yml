name: Build and publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"   # daily: picks up fixed PDFs and fresh download counts
  workflow_dispatch:        # "Run workflow" button in the Actions tab
  repository_dispatch:
    types: [files-updated]  # optional ping from foggy-press-files

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the book PDFs (private repo)
        uses: actions/checkout@v4
        with:
          repository: wmclemens/foggy-press-files
          token: ${{ secrets.FILES_TOKEN }}
          path: files
          sparse-checkout: |
            books/*/*/output/*.pdf
            books/*/*/README.md
            books/*/*/output/html/
            books/*/*/output/latex/images/
            pipeline/web/book.css
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pypdf markdown

      - name: Build
        env:
          GOATCOUNTER_CODE: ${{ vars.GOATCOUNTER_CODE || 'wmc' }}
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          SITE_DOMAIN: ${{ vars.SITE_DOMAIN || 'foggypress.com' }}
          WEB3FORMS_KEY: ${{ vars.WEB3FORMS_KEY || '560bbd06-0bf6-47ce-b04d-f68df6a5ff16' }}
        run: python build/build.py --files files --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
