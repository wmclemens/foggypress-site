name: Deploy Ask Foggy Press

# Puts supabase/functions/ask and supabase/functions/scan (My Real Books' scanner) on the Supabase project and gives
# them the Claude API key.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com, Account, Access Tokens) and ANTHROPIC_API_KEY,
# and the SUPABASE_URL repository variable. Optional: TURNSTILE_SECRET_KEY (asking without an account). Without them it does nothing. See supabase/README.md.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/ask.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # optional: lets people ask without an account, after the Turnstile check (the same widget as sign-in)
      TURNSTILE_SECRET_KEY: ${{ secrets.TURNSTILE_SECRET_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
        with:
          version: latest
      - name: Deploy the function
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set --yes --project-ref "$ref" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" > /dev/null
          fi
          if [ -n "$TURNSTILE_SECRET_KEY" ]; then
            supabase secrets set --yes --project-ref "$ref" TURNSTILE_SECRET_KEY="$TURNSTILE_SECRET_KEY" > /dev/null
          fi
          # --no-verify-jwt: guests have no sign-in token; the function itself checks who is asking
          supabase functions deploy ask --yes --no-verify-jwt --project-ref "$ref"
          # My Real Books' scanner: signed-in readers only; the function checks the token itself
          supabase functions deploy scan --yes --no-verify-jwt --project-ref "$ref"
      - name: Skipped
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_URL == ''
        run: |
          echo "::notice::Ask isn't deployed yet. Add the SUPABASE_ACCESS_TOKEN secret and the SUPABASE_URL variable (supabase/README.md)."
