name: Deploy Ask Foggy Press

# Puts supabase/functions/ask on the Supabase project and gives it the Claude API key.
# Needs two repository secrets: SUPABASE_ACCESS_TOKEN (supabase.com, Account, Access Tokens) and ANTHROPIC_API_KEY,
# and the SUPABASE_URL repository variable. Without them it does nothing. See supabase/README.md.
on:
  push:
    branches: [main]
    paths: ["supabase/functions/**", ".github/workflows/ask.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
        with:
          version: latest
      - name: Deploy the function
        if: env.SUPABASE_ACCESS_TOKEN != '' && env.SUPABASE_URL != ''
        run: |
          ref=$(echo "$SUPABASE_URL" | sed -E 's#^https?://([^.]+)\..*#\1#')
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            supabase secrets set --yes --project-ref "$ref" ANTHROPIC_API_KEY="$ANTHROPIC_API_KEY" > /dev/null
          fi
          supabase functions deploy ask --yes --project-ref "$ref"
      - name: Skipped
        if: env.SUPABASE_ACCESS_TOKEN == '' || env.SUPABASE_URL == ''
        run: |
          echo "::notice::Ask isn't deployed yet. Add the SUPABASE_ACCESS_TOKEN secret and the SUPABASE_URL variable (supabase/README.md)."
